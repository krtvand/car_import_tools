# Toyota RAV4 (Japan auctions). See mazda-cx30.toml for what the sections mean.

[site]
make = "TOYOTA"
model = "RAV4"
transmission = "auto"
year_start = 2023
year_end = 2023
mileage_end = 50000
grade = ["4", "4.5", "5"]
source = "auctions"

[api]
body_model_code = ["AXAH52", "AXAH54"]
exclude_colours = ["black", "blue"]

[sheet]
no_damage_codes = ["W", "X", "欠"]
