[project]
name = "bazaraki-scraper"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=0.116.0",
    "crawlee[beautifulsoup]>=1.7.3",
    "httpx>=0.28.1",
    "ipykernel>=7.3.0",
    "jinja2>=3.1.6",
    "jupyterlab>=4.6.2",
    "matplotlib>=3.11.1",
    "numpy>=2.1.0",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "playwright>=1.62.0",
    "scipy>=1.14.0",
    "sqlmodel>=0.0.38",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
# Each project owns its own tests; add a line here when a project is added.
testpaths = ["bazaraki/tests", "banzai24/tests", "price_calculator/tests"]
# importlib mode lets both projects hold a test_db.py without the
# duplicate-basename collision the default prepend mode causes.
#
# `-m 'not live'` keeps the paid tests out of the default run. A test suite that
# spends money every time it is run is a suite people stop running, and the
# feedback it gives — "the model still reads this one sheet correctly" — is only
# worth buying when the prompt or the schema has actually changed.
addopts = "--import-mode=importlib -m 'not live'"

markers = [
    "live: calls the Claude API — costs ~$0.015 a sheet. Excluded by default; run with `pytest -m live`.",
]
