[project]
name = "bazaraki-scraper"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "crawlee[beautifulsoup]>=1.7.3",
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.2",
    "matplotlib>=3.11.1",
    "numpy>=2.1.0",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "scipy>=1.14.0",
    "sqlmodel>=0.0.38",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
