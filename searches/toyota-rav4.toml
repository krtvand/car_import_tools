# Toyota RAV4. See mazda-cx30.toml for what the sections mean.

car = "toyota-rav4"

[site]
transmission = "auto"
grade = ["4", "4.5", "5"]
source = "auctions"

[api]
body_model_code = ["AXAH52", "AXAH54"]
exclude_colours = ["black", "blue"]

[sheet]
no_damage_codes = ["W", "X", "欠"]

# What the archive is narrowed to when measuring what these actually sell for.
# Inherits [site] and [api] — the sales measured are the car being bought — and
# adds only what differs. `source` and `status` are not written here: an archive
# search is over completed sales by definition.
[auction_statistics]
model_grade = ["HYBRID G"]        # Модификация; matched as a substring by the site
engine_capacity_start = 2.5

[dashboard]
enabled = true
expected_profit_eur = 5000

[competitors]
fuel_type = ["petrol", "hybrid petrol"]
engine_size_start = 2.5
engine_size_end = 2.5

[[band]]
year = 2023
mileage_start = 0
mileage_end = 50000
max_bid_jpy = { private = 2_505_000 }
  [band.competitors]
  year_start = 2022
  mileage_end = 70000