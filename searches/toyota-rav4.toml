# Toyota RAV4. See mazda-cx30.toml for what the sections mean.

car = "toyota-rav4"

[site]
transmission = "auto"
grade = ["4", "4.5", "5"]
source = "auctions"

[api]
body_model_code = ["AXAH52", "AXAH54"]
exclude_colours = ["black", "blue"]

[sheet]
no_damage_codes = ["W", "X", "欠"]

[dashboard]
enabled = true
expected_profit_eur = 5000

[competitors]
fuel_type = ["petrol", "hybrid petrol"]
engine_size_start = 2.5
engine_size_end = 2.5

[[band]]
year = 2023
mileage_start = 0
mileage_end = 50000
max_bid_jpy = { private = 2_505_000 }
  [band.competitors]
  year_start = 2022
  mileage_end = 70000