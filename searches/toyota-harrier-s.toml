# Toyota Harrier HYBRID S, 2023, to 50,000 km.
# See toyota-harrier-g.toml for what every section is doing and why, and
# docs/reference/harrier-grades.md for how the four trims are told apart.
#
# The odd one of the four. Toyota's 主要諸元表 2023年10月 lists no hybrid S at
# all — the S survived the 2022年10月 change only as a 2.0 petrol — yet the
# auctions carry 2023-registered AXUH80 cars badged HYBRID S, in consecutive lot
# numbers at one TAA sale, 37,000–58,000 km in three years, nearly all opening at
# exactly ¥1,000,000. That is a fleet disposal, and almost all of it is auction
# grade 3 or 3.5, which the [site] grade filter below already refuses. Expect
# this search to return very little, and read the 車歴 on what it does return
# before believing the `private` price underneath.

car = "toyota-harrier"

[site]
transmission = "auto"
grade = ["4", "4.5", "5"]
source = "auctions"

[api]
exclude_colours = ["black", "blue"]
exclude_model_grades = ["Z", "G"]

[sheet]
no_damage_codes = ["W", "X", "欠"]

[auction_statistics]

[dashboard]
enabled = true
expected_profit_percent = 20

[competitors]
fuel_type = ["hybrid petrol"]
engine_size_start = 2.5
engine_size_end = 2.5


[[band]]
year = 2023
body_model_code = ["AXUH80", "AXUH85"]
mileage_start = 0
mileage_end = 50000
# PROVISIONAL, and the thinnest of the four: solved against a €25,000 Cyprus
# asking price at 50,000 km, which is extrapolated from a single advert — an
# S-package import asking €26,500 at 22,000 km. One advert is not a market.
# No S in the archive walk had sold yet, so there is no hammer price to check
# this against either; what is known is that the fleet lots *open* at ¥1,000,000,
# a long way under this ceiling.
max_bid_jpy = { private = 2_224_000 }

  [band.competitors]
  year_start = 2022
  mileage_end = 70000
  # Nothing cheaper to exclude — the S is the bottom of the range.
  exclude_phrases = ["coming soon"]
