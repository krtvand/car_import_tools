
car = "toyota-harrier"

[site]
transmission = "auto"
source = "auctions"

[api]
exclude_colours = ["black", "blue"]
# "LEATHER" is the word that has to be banned here, and it is banned rather than
# "Z LEATHER PACKAGE": the houses write the same car three ways — "HYBRID Z
# LEATHER PACKAGE", "HYBRID Z LEATHER PACKAGE 4WD", "4WD HYBRID Z LEATHER
# PACKAGE" — and the one word is in all three. It cannot catch anything else,
# because no other 2023 Harrier grade has a leather package.
exclude_model_grades = ["G", "S"]

[sheet]
no_damage_codes = ["W", "X", "欠"]

[auction_statistics]

[dashboard]
enabled = true
expected_profit_percent = 20

[competitors]
fuel_type = ["hybrid petrol"]
engine_size_start = 2.5
engine_size_end = 2.5
# Both trims below a Z undercut it. Adverts that name no grade stay in.
exclude_phrases = ["hybrid s", "s package", "hybrid g", "g package",
                   "g model", "coming soon"]


# Each mileage range is two bands, split on the 評価点: a 5 is worth paying more
# for than a 4.5 of the same year and the same kilometres, and one price for both
# was either overpaying for the 4.5 or losing the 5. The fetch still asks for all
# three grades, because it is the union of what the bands below price.
#
# BOTH HALVES CARRY THE OLD SINGLE PRICE for now — the split is structural until
# the archive says what the two conditions actually hammer for. Each half walks
# its own archive now, so `banzai24 stats --search toyota-harrier-z` is what
# answers it; set the two numbers off what comes back.

[[band]]
year = 2023
body_model_code = ["AXUH80", "AXUH85"]
grade = ["4", "4.5"]
mileage_start = 0
mileage_end = 35000
max_bid_jpy = { private = 2_885_000 }

  [band.competitors]
  year_start = 2022
  mileage_end = 50000

[[band]]
year = 2023
body_model_code = ["AXUH80", "AXUH85"]
grade = ["5"]
mileage_start = 0
mileage_end = 35000
max_bid_jpy = { private = 2_885_000 }

  [band.competitors]
  year_start = 2022
  mileage_end = 50000

[[band]]
year = 2023
body_model_code = ["AXUH80", "AXUH85"]
grade = ["4", "4.5"]
mileage_start = 35001
mileage_end = 50000
max_bid_jpy = { private = 2_835_000 }

  [band.competitors]
  year_start = 2022
  mileage_end = 70000

[[band]]
year = 2023
body_model_code = ["AXUH80", "AXUH85"]
grade = ["5"]
mileage_start = 35001
mileage_end = 50000
max_bid_jpy = { private = 2_835_000 }

  [band.competitors]
  year_start = 2022
  mileage_end = 70000
