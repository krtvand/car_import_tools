# Toyota Harrier HYBRID Z — the plain one, without the leather package.
# 2023, to 50,000 km. See toyota-harrier-g.toml for what every section is doing,
# and docs/reference/harrier-grades.md for how the four trims are told apart.

car = "toyota-harrier"

[site]
transmission = "auto"
grade = ["4", "4.5", "5"]
source = "auctions"

[api]
exclude_colours = ["black", "blue"]
# "LEATHER" is the word that has to be banned here, and it is banned rather than
# "Z LEATHER PACKAGE": the houses write the same car three ways — "HYBRID Z
# LEATHER PACKAGE", "HYBRID Z LEATHER PACKAGE 4WD", "4WD HYBRID Z LEATHER
# PACKAGE" — and the one word is in all three. It cannot catch anything else,
# because no other 2023 Harrier grade has a leather package.
exclude_model_grades = ["G", "S", "LEATHER"]

[sheet]
no_damage_codes = ["W", "X", "欠"]

[auction_statistics]

[dashboard]
enabled = false
expected_profit_percent = 20

[competitors]
fuel_type = ["hybrid petrol"]
engine_size_start = 2.5
engine_size_end = 2.5


[[band]]
year = 2023
body_model_code = ["AXUH80", "AXUH85"]
mileage_start = 0
mileage_end = 50000
# PROVISIONAL: solved against a €28,800 Cyprus asking price at 50,000 km, from
# the one 2023 advert that states a Z — €29,900 at 32,750 km, auction grade 5.
#
# Read this one knowing it may not be buyable. The four Zs in the archive walk
# hammered ¥2.40M, ¥3.17M, ¥3.18M and ¥3.45M, all of them at 9,000–21,000 km, so
# a 50,000 km car has to come in a long way under its low-mileage siblings for
# this ceiling to be reached at all. If the report shows nothing but lots priced
# over the bid for a few weeks, that is the answer rather than a fault: the Z's
# Japanese price and its Cyprus price are ~€1,000 apart and the G's are further.
max_bid_jpy = { private = 2_649_000 }

  [band.competitors]
  year_start = 2022
  mileage_end = 70000
  # Both trims below a Z undercut it. Adverts that name no grade stay in.
  exclude_phrases = ["hybrid s", "s package", "hybrid g", "g package",
                     "g model", "coming soon"]
