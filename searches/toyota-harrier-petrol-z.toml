
car = "toyota-harrier"

[site]
transmission = "auto"
grade = ["4", "4.5", "5"]
source = "auctions"

[api]
exclude_colours = ["black", "blue"]
exclude_model_grades = ["S", "G"]

[sheet]
no_damage_codes = ["W", "X", "欠"]

[auction_statistics]

[dashboard]
enabled = true
expected_profit_percent = 20

[competitors]
fuel_type = ["petrol"]
engine_size_start = 2.0
engine_size_end = 2.0


[[band]]
year = 2023
body_model_code = ["MXUA80", "MXUA85"]
mileage_start = 0
mileage_end = 35000
max_bid_jpy = { private = 2_858_000 }

  [band.competitors]
  year_start = 2022
  mileage_end = 50000
  # Both trims below a Z undercut it. Adverts that name no grade stay in, and so
  # do leather-package ones: they are dearer, not cheaper. "leather" alone is
  # never used here — Cyprus adverts list "leather seats" on cars that are
  # plainly not leather-package Zs.
  exclude_phrases = ["s package", "s model", "g package", "g model",
                     "coming soon"]

[[band]]
year = 2023
body_model_code = ["MXUA80", "MXUA85"]
mileage_start = 35001
mileage_end = 50000
max_bid_jpy = { private = 2_787_000 }

  [band.competitors]
  year_start = 2022
  mileage_end = 70000
  exclude_phrases = ["s package", "s model", "g package", "g model",
                     "coming soon"]
