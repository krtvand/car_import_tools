# The cost book — every price in force that is not a property of one car.
#
# Edit this when a supplier or the state changes a price. Never edit it to
# change how the money is worked out: that argument lives in
# price_calculator/calculator.py, which holds no numbers at all.
#
# Cell references are the operator's spreadsheet, kept so the two can be
# reconciled; the formulas are in price_calculator_spec.md §3.
#
# A run stamps this whole file into costs.json, so a report re-opened months
# later shows the prices it was priced with. Raising a number here changes what
# you bid tomorrow, not what you decided last week.

updated = 2026-08-25
source = "exporter price list, Aug 2026; road tax from Law 47(I)/2019"

# --- the exporter, JPY -------------------------------------------------------

[exporter]
fixed_fee_jpy = 17_000              # C8 = 10,000 + 7,000
certificate_of_origin_jpy = 1_200   # C9

# Exporter service fees!A3:C6 — a sorted VLOOKUP on the hammer price. Bands are
# inclusive of their upper bound: at 59,000/74,000 below, ¥1,000,000 pays
# ¥59,000 and ¥1,000,001 pays ¥74,000. Above the last band the fee is held and
# the report says so, because a VLOOKUP running off the end is an accident
# rather than a quote. Keep these ascending by `up_to_jpy`; the loader refuses
# a table that is not.
[[exporter.service_fee]]
up_to_jpy = 1_000_000
fee_jpy = 59_000

[[exporter.service_fee]]
up_to_jpy = 1_500_000
fee_jpy = 74_000

[[exporter.service_fee]]
up_to_jpy = 2_000_000
fee_jpy = 94_000

[[exporter.service_fee]]
up_to_jpy = 2_500_000
fee_jpy = 114_000

[[exporter.service_fee]]
up_to_jpy = 9_000_000
fee_jpy = 134_000

# --- shipping, USD -----------------------------------------------------------

[freight]
roro_per_m3_usd = 168       # C10, billed on the body's box
insurance_usd = 0          # B19, flat. Set to 0 to ship uninsured.

# --- the state, EUR ----------------------------------------------------------

[taxes]
vat_rate = "0.19"           # B34, Cyprus. Charged on customs value plus duty.

# B35: "Starting January 2026, import duty on cars originating from Japan is
# reduced to zero, provided that all required documentation is submitted." The
# zero is a condition being met, not a property of the world — if the paperwork
# is ever short, this is the line that changes.
duty_rate = "0"

# --- road tax (τέλη κυκλοφορίας) ---------------------------------------------
#
# Motor Vehicles and Road Traffic Law 86/1972, Schedule I, as amended by Law
# 47(I)/2019 — the reform that abolished the consumption tax and put circulation
# fees on CO2. A car imported and registered today falls under it whatever its
# age, because the trigger is the date of first registration *in Cyprus*.
#
# The scale is **marginal**, like income-tax brackets: the law says "για μέρος
# μάζας …", for the *portion* of the value. 133 g/km is not 133 x 3.00; it is
# 120 x 0.50 + 13 x 3.00 = EUR 99.00. Checkpoints to reconcile against:
# 90 -> 60 -> 45 · 120 -> 60 · 150 -> 150 · 180 -> 300 · 200 -> 500.
#
# Ascending by `up_to_gkm`, and only the **last** band may omit it — that band
# runs to the cap. The loader refuses anything else, for the reason the exporter
# fee table gives: a table read out of order silently charges the wrong price.
#
# The cap is declared first because TOML says so: every bare key after the first
# [[taxes.road_tax_band]] below belongs to that band, not to [taxes].
road_tax_cap_eur = 1_500    # on the CO2-derived annual fee; reached at 300 g/km

[[taxes.road_tax_band]]
up_to_gkm = 120
eur_per_gram = "0.50"

[[taxes.road_tax_band]]
up_to_gkm = 150
eur_per_gram = "3.00"

[[taxes.road_tax_band]]
up_to_gkm = 180
eur_per_gram = "5.00"

[[taxes.road_tax_band]]
eur_per_gram = "10.00"      # everything above 180, to the cap

# Schedule I §8(c) — a one-off paid **at first registration**, not annually, on
# top of the part-year fee above. Euro standard x fuel.
#
# Zero for everything Euro 6, which is every model in model_specs.csv today, so
# this table costs nothing until a pre-2015 car is priced. It is here rather
# than assumed away because the day it stops being zero it is EUR 600, and that
# is not a rounding error to discover on a card.
#
# The Euro 5b/diesel row is the least corroborated of the eight; the rest are
# confirmed in the text of Law 47(I)/2019.
#
# A car whose fuel is not recorded is priced from the **diesel** column, which
# is the dearer of the two on every row — unlike the private/rental assumption
# in banzai24.bidding, this one has a cautious side and takes it.
[taxes.first_registration_surcharge]
euro6_petrol_eur = 0
euro6_diesel_eur = 0
euro5b_petrol_eur = 0
euro5b_diesel_eur = 50
euro5a_petrol_eur = 100
euro5a_diesel_eur = 250
euro4_petrol_eur = 300
euro4_diesel_eur = 600

# --- money moving, EUR -------------------------------------------------------

[bank]
fx_rate = "0.01"                # B10, Revolut's 1% on the exchange
international_transfer_eur = 60 # two payments x EUR 30

# B32: the sheet reads EUR/JPY live and knocks two yen off it. Nobody charges
# this — it is a deliberate haircut on the rate the bank actually gives you, and
# it errs towards the car costing more. USD/JPY deliberately has no equivalent.
eur_jpy_spread = 2

# --- the bills at this end, EUR (B21:B29) ------------------------------------

# Itemised rather than totalled so a diff shows which one moved. Every line is
# a bill that arrives before a buyer can take the keys; there is no flag to
# exclude the ownership-flavoured ones, and calculator.py says why.
# B28 (road tax) is deliberately absent: it is the one bill that is a function
# of the car, and it now comes off the CO2 band table under [taxes] rather than
# standing at a flat figure here. See spec §5.
[cyprus]
sva_test_eur = 140              # B22
mot_eur = 35                    # B23
registration_eur = 200          # B24 = 150 department + 50 agent
customs_clearance_eur = 513     # B25 = 339 + 10 + 10 + 10 + 15 + 10 + 119
number_plates_eur = 30          # B26
car_service_eur = 120           # B27, oil and filters
insurance_eur = 50              # B29

# --- turning the car back into cash, EUR -------------------------------------

# Transfer of ownership and advertising. Zero until you have receipts — a
# made-up number here would be indistinguishable from a measured one on the
# page. Zero is not the same as free, and it is emphatically not "no VAT to
# worry about": calculator.py explains what this line does not hold.
[resale]
costs_eur = 0
